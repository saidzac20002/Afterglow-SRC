<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>opium AI</title>
  <link rel="stylesheet" href="ai.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">opium<span>AI</span></div>
    <div class="sidebar-actions">
      <button class="side-btn active" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <button class="side-btn" id="screenshare" type="button" title="Not available in this build">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg>
        Screenshare
      </button>
    </div>
    <div class="recents-label">Recent</div>
    <div class="recents" id="recents"></div>
  </aside>
  <main class="main">
    <div class="topbar"><span class="status" id="status">connecting…</span></div>
    <div class="chat" id="chat"><div class="chat-inner" id="chatInner"><div class="welcome" id="welcome">What <em>can</em> I help with?</div></div></div>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <button class="icon-btn" type="button" id="attachBtn" title="Attach">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
        <div class="composer-right">
          <button class="web-toggle" type="button" id="webSearch" title="Web search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          </button>
          <select class="model-select" id="model" aria-label="Model"></select>
          <button class="send-btn" id="send" type="submit" disabled aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8-8-8z"/></svg>
          </button>
        </div>
      </form>
    </div>
  </main>
  <script src="ai.js"></script>
</body>
</html>
