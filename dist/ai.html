<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grok</title>
<link rel="stylesheet" href="ai.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sb-top">
    <button class="sb-icon" title="Search" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    </button>
    <button class="sb-icon" title="Collapse" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
    </button>
  </div>
  <nav class="nav">
    <button class="nav-item active" type="button" id="navChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      Chat <span class="kbd">Ctrl+J</span>
    </button>
    <button class="nav-item" type="button" id="navImagine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Imagine <span class="dot"></span>
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 17V9m5 8V5m5 12v-6"/></svg>
      Library
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 10-12h-7l0-8z"/></svg>
      Automations
    </button>
  </nav>
  <div class="section"><span>Chats</span>
    <div class="row">
      <button class="sb-icon" id="newChat" title="New chat" type="button" style="width:28px;height:28px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <div class="chats" id="recents"></div>
  <div class="sb-bottom">
    <div class="user"><div class="avatar">S</div><span>You</span></div>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <button class="top-link" type="button"><span class="orb"></span> Grok Bot</button>
    <button class="top-link private" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Private
    </button>
  </div>
  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner">
      <div class="empty" id="empty">
        <h1>What should we explore?</h1>
        <div class="composer-card">
          <textarea id="input" rows="1" placeholder="Type / to use slash commands" autocomplete="off"></textarea>
          <div class="composer-tools">
            <button class="tool-btn" type="button" id="attachBtn" title="Attach">+</button>
            <button class="tool-btn" type="button" id="screenshare" title="Screenshare">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg>
            </button>
            <button class="tool-btn" type="button" id="webSearch" title="Web search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
            </button>
            <span class="spacer"></span>
            <select class="model-chip" id="model" aria-label="Model"></select>
            <button class="voice-btn" type="button" title="Voice" id="voiceBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="9" width="2.5" height="6" rx="1"/><rect x="8.5" y="6" width="2.5" height="12" rx="1"/><rect x="13" y="8" width="2.5" height="8" rx="1"/><rect x="17.5" y="10" width="2.5" height="4" rx="1"/></svg>
            </button>
            <button class="send-fab" id="send" type="button" disabled aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
            </button>
          </div>
        </div>
        <div class="promo" id="promo">
          <div class="bot"></div>
          <div class="txt">
            <strong>Meet Grok Bot</strong>
            <span>AI teammates you can give real work to. They use your tools just like you do.</span>
          </div>
          <div class="actions">
            <button class="link" type="button" id="promoDismiss">Dismiss</button>
            <button class="upgrade" type="button">Upgrade</button>
          </div>
        </div>
      </div>
      <div id="thread" hidden>
        <div class="ss-bar" id="ssBar">
          <video id="ssVideo" autoplay muted playsinline></video>
          <div class="ss-meta"><strong>Screen sharing</strong><span id="ssLabel">Live</span></div>
          <button type="button" class="p" id="ssAsk">Ask about screen</button>
          <button type="button" class="g" id="ssStop">Stop</button>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="composer-card" style="margin-top:auto">
          <textarea id="input2" rows="1" placeholder="Message Grok…" autocomplete="off"></textarea>
          <div class="composer-tools">
            <button class="tool-btn" type="button" id="attachBtn2">+</button>
            <button class="tool-btn" type="button" id="screenshare2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg>
            </button>
            <button class="tool-btn" type="button" id="webSearch2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
            </button>
            <span class="spacer"></span>
            <select class="model-chip" id="model2"></select>
            <button class="send-fab" id="send2" type="button" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<input type="file" id="fileInput" accept="image/*" hidden/>
<span class="status" id="status">connecting…</span>
<script src="ai.js"></script>
</body>
</html>
