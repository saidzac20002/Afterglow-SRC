<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grok</title>
<link rel="stylesheet" href="ai.css"/>
</head>
<body>
<aside class="sidebar">
  <nav class="nav">
    <button class="nav-item active" type="button" id="navChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
      Chat
    </button>
  </nav>
  <div class="section"><span>Chats</span>
    <div class="row">
      <button class="sb-icon" id="newChat" title="New chat" type="button" style="width:28px;height:28px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <div class="chats" id="recents"></div>
</aside>
<main class="main">
  <div class="stage" id="stage">
    <div class="stage-inner" id="stageInner">
      <div class="empty" id="empty">
        <h1>What should we explore?</h1>
        <div class="composer-card">
          <textarea id="input" rows="1" placeholder="Type / to use slash commands" autocomplete="off"></textarea>
          <div class="composer-tools">
            <button class="tool-btn" type="button" id="attachBtn" title="Attach">+</button>
            <button class="tool-btn" type="button" id="screenshare" title="Screenshare">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg>
            </button>
            <button class="tool-btn" type="button" id="webSearch" title="Web search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
            </button>
            <span class="spacer"></span>
            <div class="model-wrap" id="modelWrap">
              <button type="button" class="model-btn" id="modelBtn">
                <span class="model-btn-icon" id="modelBtnIcon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 10-12h-7z"/></svg></span>
                <span class="model-btn-label" id="modelBtnLabel">Fast</span>
                <svg class="model-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="model-menu" id="modelMenu" hidden></div>
            </div>
            <button class="send-fab" id="send" type="button" disabled aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="thread" hidden>
        <div class="ss-bar" id="ssBar">
          <video id="ssVideo" autoplay muted playsinline></video>
          <div class="ss-meta"><strong>Screen sharing</strong><span id="ssLabel">Live</span></div>
          <button type="button" class="p" id="ssAsk">Ask about screen</button>
          <button type="button" class="g" id="ssStop">Stop</button>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="composer-card" style="margin-top:auto">
          <textarea id="input2" rows="1" placeholder="Message Grok…" autocomplete="off"></textarea>
          <div class="composer-tools">
            <button class="tool-btn" type="button" id="attachBtn2">+</button>
            <button class="tool-btn" type="button" id="screenshare2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/></svg>
            </button>
            <button class="tool-btn" type="button" id="webSearch2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
            </button>
            <span class="spacer"></span>
            <div class="model-wrap" id="modelWrap2">
              <button type="button" class="model-btn" id="modelBtn2">
                <span class="model-btn-icon" id="modelBtnIcon2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 10-12h-7z"/></svg></span>
                <span class="model-btn-label" id="modelBtnLabel2">Fast</span>
                <svg class="model-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="model-menu" id="modelMenu2" hidden></div>
            </div>
            <button class="send-fab" id="send2" type="button" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<input type="file" id="fileInput" accept="image/*" hidden/>
<span class="status" id="status">connecting…</span>
<script src="ai.js"></script>
</body>
</html>
